function seeded(n, i) {
  const x = Math.sin(n * 127.1 + i * 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = function (n) { return (n + h / 30) % 12; };
  const a = s * Math.min(l, 1 - l);
  const f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
  const to = function (v) { return Math.round(v * 255).toString(16).padStart(2, '0'); };
  return '#' + to(f(0)) + to(f(8)) + to(f(4));
}
function buildNebula(rgb, n) {
  const r = rgb[0], g = rgb[1], b = rgb[2];
  return [
    [110 + seeded(n, 1) * 60, 170 + seeded(n, 2) * 60, 280, 'rgba(' + r + ',' + g + ',' + b + ',.30)'],
    [400 - seeded(n, 3) * 60, 330 + seeded(n, 4) * 60, 300, 'rgba(' + Math.min(255, r + 40) + ',' + Math.max(0, g - 30) + ',' + Math.min(255, b + 40) + ',.20)'],
    [230 + seeded(n, 5) * 60, 660, 340, 'rgba(' + Math.max(0, r - 30) + ',' + Math.min(255, g + 20) + ',' + b + ',.20)'],
    [60 + seeded(n, 6) * 40, 470, 200, 'rgba(' + r + ',' + Math.max(0, g - 40) + ',' + Math.min(255, b + 30) + ',.16)']
  ];
}
function themeFor(n) {
  if (n <= BASE_THEMES.length) {
    const t = BASE_THEMES[n - 1];
    const rgb = t.rgb || t[3];
    return { name: t.name || t[0], boss: t.boss || t[1], tint: t.tint || t[2], rgb: rgb, neb: buildNebula(rgb, n) };
  }
  const hue = Math.round((n * 47) % 360);
  const rgb = [
    Math.round(127 + 127 * Math.cos(hue * Math.PI / 180)),
    Math.round(127 + 127 * Math.cos((hue - 120) * Math.PI / 180)),
    Math.round(127 + 127 * Math.cos((hue - 240) * Math.PI / 180))
  ];
  const pi = Math.floor(seeded(n, 1) * NAME_PRE.length);
  const si = Math.floor(seeded(n, 2) * NAME_SUF.length);
  const ai = Math.floor(seeded(n, 4) * NAME_PRE.length);
  const bi = Math.floor(seeded(n, 3) * BOSS_NOUN.length);
  return {
    name: NAME_PRE[pi] + NAME_SUF[si],
    boss: NAME_PRE[ai] + BOSS_NOUN[bi],
    tint: hslToHex(hue, 72, 62),
    rgb: rgb,
    neb: buildNebula(rgb, n)
  };
}

function readStore(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return o && typeof o === 'object' ? o : null;
  } catch (e) { return null; }
}

function loadSave() {
  // 主存档优先，读不出来就退回备份存档
  const main = readStore(SAVE_KEY);
  const bak = readStore(SAVE_BAK_KEY);
  const pick = main || bak;
  if (pick) {
    for (const k in SAVE) if (pick[k] !== undefined) SAVE[k] = pick[k];
  }
  if (!Array.isArray(SAVE.owned) || !SAVE.owned.length) SAVE.owned = ['scout'];
  if (!Array.isArray(SAVE.unlocked)) SAVE.unlocked = [];
  if (!SKINS.some(function (s) { return s.id === SAVE.skin; })) SAVE.skin = 'scout';
  if (!DIFFS.some(function (d) { return d.id === SAVE.diff; })) SAVE.diff = 'hard';
  if (!LANGS.some(function (l) { return l.code === SAVE.lang; })) SAVE.lang = 'zh';
  if (!SAVE.stageBest || typeof SAVE.stageBest !== 'object') SAVE.stageBest = {};
  if (typeof SAVE.volume !== 'number') SAVE.volume = 1;
  if (typeof SAVE.shake !== 'boolean') SAVE.shake = true;
  if (typeof SAVE.flash !== 'boolean') SAVE.flash = true;
  if (typeof SAVE.bgm !== 'boolean') SAVE.bgm = true;
  if (typeof SAVE.sfx !== 'boolean') SAVE.sfx = true;
  if (typeof SAVE.coins !== 'number' || !isFinite(SAVE.coins)) SAVE.coins = 0;
  if (typeof SAVE.maxStage !== 'number') SAVE.maxStage = 0;
  muted = !!SAVE.muted;

  storageOK = probeStorage();
  // 主存档与备份都补写一遍，保证双份一致
  if (pick) persist();
}

function probeStorage() {
  try {
    const t = '__sl_probe__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return true;
  } catch (e) { return false; }
}

function persist(force) {
  if (saveBlocked) return;   // 清档或导入期间不再回写，避免页面卸载时把旧档写回来
  const json = JSON.stringify(SAVE);
  if (!force && json === lastJson) { return; }   // 内容没变就不重复写，避免多标签页互相覆盖
  let ok = false;
  try {
    localStorage.setItem(SAVE_BAK_KEY, json);
    localStorage.setItem(SAVE_KEY, json);
    ok = true;
  } catch (e) { ok = false; }
  storageOK = ok;
  saveTs = Date.now();
  if (ok) lastJson = json;
}

function saveClock() {
  if (!saveTs) return t('save_none');
  const d = new Date(saveTs);
  const p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function exportSave() {
  persist(true);
  const payload = { v: 4, game: 'STARLINE', exportedAt: new Date().toISOString(), save: SAVE };
  let url = '';
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'starline-save-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();

function applyImportedSave(src) {
  for (const k in SAVE) if (src[k] !== undefined) SAVE[k] = src[k];
  if (!Array.isArray(SAVE.owned) || !SAVE.owned.length) SAVE.owned = ['scout'];
  SAVE.owned = SAVE.owned.filter(function (id) { return SKINS.some(function (s) { return s.id === id; }); });
  if (!SAVE.owned.length) SAVE.owned = ['scout'];
  if (!Array.isArray(SAVE.unlocked)) SAVE.unlocked = [];
  if (!SKINS.some(function (s) { return s.id === SAVE.skin; })) SAVE.skin = SAVE.owned[0];
  if (!DIFFS.some(function (d) { return d.id === SAVE.diff; })) SAVE.diff = 'hard';
  SAVE.coins = Math.max(0, Math.floor(Number(SAVE.coins) || 0));
  SAVE.best = Math.max(0, Math.floor(Number(SAVE.best) || 0));
  SAVE.maxStage = Math.max(0, Math.min(TOTAL_STAGES, Math.floor(Number(SAVE.maxStage) || 0)));
  if (!SAVE.stageBest || typeof SAVE.stageBest !== 'object') SAVE.stageBest = {};
  persist(true);
}

function importSaveFromFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = function () {
    try {
      const o = JSON.parse(String(fr.result));
      const src = o && o.save && typeof o.save === 'object' ? o.save : o;
      if (!src || typeof src !== 'object' || src.coins === undefined) throw new Error('bad');

      showScreen(settingsHTML());

      toast(t('toast_import_bad'));

  };

}

let actx = null, master = null, sfxBus = null, bgmBus = null, muted = false, noiseBuf = null;
const SFX_BOOST = 1.75;

function AC() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = muted || !SAVE.sfx ? 0 : SAVE.volume;
      sfxBus = actx.createGain(); sfxBus.gain.value = SFX_BOOST;
      bgmBus = actx.createGain(); bgmBus.gain.value = 1;
      sfxBus.connect(master); bgmBus.connect(master);
      master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  return actx;
}
function toneAt(freq, when, dur, type, vol, slideTo, bus) {
  const ac = AC(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, when);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), when + dur);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol || 0.04, when + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bus || sfxBus);
  o.start(when); o.stop(when + dur + 0.03);
}
function noiseAt(when, dur, vol, freq, bus) {
  const ac = AC(); if (!ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.8), ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol || 0.08, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  const f = ac.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(freq || 2000, when);
  f.frequency.exponentialRampToValueAtTime(240, when + dur);
  src.connect(f); f.connect(g); g.connect(bus || sfxBus);
  src.start(when); src.stop(when + dur + 0.03);
}
function now() { const ac = AC(); return ac ? ac.currentTime : 0; }

const SFX = {
  shoot: function () { toneAt(1150, now(), 0.045, 'square', 0.013, 700); },
  hit: function () { toneAt(300, now(), 0.028, 'square', 0.012, 190); },

const BGM = {
  on: false, step: 0, next: 0, timer: null, stepDur: 0.132,
  start: function () {
    const ac = AC(); if (!ac || this.on) return;
    this.on = true; this.step = 0; this.next = ac.currentTime + 0.08;
    const self = this;
    this.timer = setInterval(function () { self.tick(); }, 70);
  },
  stop: function () {
    this.on = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  },
  tick: function () {
    const ac = AC(); if (!ac || !this.on) return;
    while (this.next < ac.currentTime + 0.25) {
      this.note(this.step, this.next);
      this.step = (this.step + 1) % 32;
      this.next += this.stepDur;
    }
  },
  note: function (i, t) {
    if (!SAVE.bgm || muted) return;
    const root = 110;
    const bars = [0, 0, -4, 3];
    const bar = Math.floor(i / 8) % 4;
    const base = bars[bar];
    if (i % 4 === 0) {
      toneAt(root * Math.pow(2, base / 12), t, 0.42, 'sine', 0.055, null, bgmBus);
      toneAt(root * 2 * Math.pow(2, base / 12), t, 0.18, 'triangle', 0.012, null, bgmBus);
    }
    if (i % 2 === 0) {
      const sc = [0, 3, 5, 7, 10, 12, 10, 7];
      const k = sc[(i / 2) % 8];
      toneAt(root * 2 * Math.pow(2, (k + base) / 12), t, 0.15, 'triangle', 0.013, null, bgmBus);
    }
    if (i % 4 === 2) noiseAt(t, 0.045, 0.006, 8000, bgmBus);
  }
};

function setMuted(v) {
  muted = v;
  SAVE.muted = v;
  persist();
  applyVolume();
}
function applyVolume() {
  const ac = AC();
  if (ac && master) master.gain.value = muted || !SAVE.sfx ? 0 : SAVE.volume;
}
function setVolume(v) {
  SAVE.volume = clamp(v, 0, 1);
  persist();
  applyVolume();
}
function setOption(key, v) {
  SAVE[key] = !!v;
  persist();
  if (key === 'sfx') applyVolume();
}

   画布
   ========================================================= */
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const cw = Math.max(260, Math.floor(W * s));
  const ch = Math.floor(H * s);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const k = (cw * dpr) / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.imageSmoothingEnabled = true;
}

/* =========================================================
   战机绘制（游戏内与商店缩略图共用）
   ========================================================= */
function shipPath(g, hull) {
  g.beginPath();
  if (hull === 1) {
    g.moveTo(0, -22); g.lineTo(7, 2); g.lineTo(3, 1); g.lineTo(0, 9);
    g.lineTo(-3, 1); g.lineTo(-7, 2); g.closePath();
  } else if (hull === 2) {
    g.moveTo(0, -16); g.lineTo(9, -6); g.lineTo(16, 5); g.lineTo(8, 3);
    g.lineTo(0, 10); g.lineTo(-8, 3); g.lineTo(-16, 5); g.lineTo(-9, -6); g.closePath();
  } else if (hull === 3) {
    g.moveTo(0, -21); g.lineTo(5, -4); g.lineTo(14, 8); g.lineTo(4, 5);
    g.lineTo(0, 11); g.lineTo(-4, 5); g.lineTo(-14, 8); g.lineTo(-5, -4); g.closePath();
  } else if (hull === 4) {
    g.moveTo(0, -17); g.quadraticCurveTo(11, -8, 15, 6); g.lineTo(6, 3);
    g.lineTo(0, 10); g.lineTo(-6, 3); g.lineTo(-15, 6); g.quadraticCurveTo(-11, -8, 0, -17);
    g.closePath();
  } else if (hull === 5) {
    g.moveTo(0, -22); g.lineTo(6, -2); g.quadraticCurveTo(16, 5, 12, 10); g.lineTo(3, 6);
    g.lineTo(0, 12); g.lineTo(-3, 6); g.lineTo(-12, 10); g.quadraticCurveTo(-16, 5, -6, -2);
    g.closePath();
  } else {
    g.moveTo(0, -19); g.lineTo(11, 6); g.lineTo(4, 4); g.lineTo(0, 11);
    g.lineTo(-4, 4); g.lineTo(-11, 6); g.closePath();
  }
}

function paintShip(g, sk, t, s) {
  s = s || 1;
  g.save();
  g.scale(s, s);

  g.save();
  g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 36);
  gr.addColorStop(0, sk.glow);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(0, 0, 36, 0, TAU); g.fill();
  g.restore();

  const flame = 9 + Math.sin(t * 34) * 4;
  g.save();
  g.globalCompositeOperation = 'lighter';
  const fg = g.createLinearGradient(0, 7, 0, 13 + flame);
  fg.addColorStop(0, sk.trail);
  fg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fg;
  g.beginPath();
  g.moveTo(-5, 7); g.lineTo(0, 12 + flame); g.lineTo(5, 7);
  g.closePath(); g.fill();
  g.restore();

  shipPath(g, sk.hull);
  const bg = g.createLinearGradient(0, -22, 0, 12);
  bg.addColorStop(0, sk.c[0]);
  bg.addColorStop(0.55, sk.c[1]);
  bg.addColorStop(1, sk.c[2]);
  g.fillStyle = bg;
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,.72)';
  g.lineWidth = 1.2;
  g.stroke();

  g.fillStyle = 'rgba(255,255,255,.94)';
  g.beginPath();
  g.ellipse(0, sk.hull === 1 ? -6 : -4, 2.8, 6, 0, 0, TAU);
  g.fill();

  g.strokeStyle = hexA(sk.c[2], 0.9);
  g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(-7, sk.hull === 1 ? 0 : 3);
  g.lineTo(7, sk.hull === 1 ? 0 : 3);
  g.stroke();

  g.restore();
}

const nebulaCache = {};
function nebulaFor(stageNo) {
  const idx = ((stageNo - 1) % 40) + 1;
  if (nebulaCache[idx]) return nebulaCache[idx];
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#04060f'; g.fillRect(0, 0, W, H);
  const blobs = themeFor(idx).neb;
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const grd = g.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
    grd.addColorStop(0, b[3]);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(b[0], b[1], b[2], 0, TAU); g.fill();
  }
  nebulaCache[idx] = c;
  return c;
}

/* =========================================================
   出怪
   ========================================================= */
function pickType(gw) {
  const w = [];
  w.push(['grunt', Math.max(14, 46 - gw * 1.2)]);
  if (gw >= 2) w.push(['dart', 24]);
  if (gw >= 5) w.push(['orb', 16 + Math.min(10, gw)]);
  if (gw >= 8) w.push(['tank', 12 + Math.min(8, gw * 0.4)]);
  let total = 0;
  for (let i = 0; i < w.length; i++) total += w[i][1];
  let r = Math.random() * total;
  for (let i = 0; i < w.length; i++) { r -= w[i][1]; if (r <= 0) return w[i][0]; }
  return 'grunt';
}

function spawnEnemy(type) {
  const d = curDiff();
  const gw = Math.max(1, globalWave());
  const hpS = Math.min(14, 1 + (gw - 1) * 0.05) * d.hp;
  const e = { type: type, t: 0, phase: rand(0, TAU), fireT: rand(0.9, 1.9), hitT: 0, dead: false, vx: 0, vy: 0 };

  if (type === 'grunt') {
    e.x = rand(42, W - 42); e.y = -42; e.r = 15;
    e.hp = Math.round(3 * hpS); e.vy = Math.min(260, 120 + gw * 4) * d.spd;
    e.score = 10; e.color = '#ff5fd2'; e.coins = 1;
  } else if (type === 'dart') {
    e.x = rand(42, W - 42); e.y = -42; e.r = 13;
    e.hp = Math.round(2 * hpS); e.vy = Math.min(320, 250 + gw * 8) * d.spd;
    e.score = 16; e.color = '#ffa34d'; e.coins = 1;
    e.vx = clamp((player.x - e.x) * 0.34, -190, 190);
  } else if (type === 'tank') {
    e.x = rand(64, W - 64); e.y = -52; e.r = 22;
    e.hp = Math.round(11 * hpS); e.vy = 72 * d.spd;
    e.score = 40; e.color = '#b06bff'; e.coins = 3;
    e.stopY = rand(110, 200);
  } else if (type === 'orb') {
    e.x = rand(64, W - 64); e.y = -52; e.r = 18;
    e.hp = Math.round(7 * hpS); e.vy = 86 * d.spd;
    e.score = 32; e.color = '#5cf0a0'; e.coins = 2;
    e.stopY = rand(150, 270);
  } else if (type === 'boss') {
    e.x = W / 2; e.y = -110; e.r = 54;
    e.hp = Math.round((50 + Math.min(state.stage, 300) * 2.2) * d.hp);
    e.score = 500; e.color = themeFor(state.stage).tint;
    e.stopY = 196; e.pattern = 0; e.minionT = 5; e.boss = true;
    e.spin = 0;
    boss = e;
    SFX.warn();
  }
  e.maxhp = e.hp;
  enemies.push(e);
}

function buildWave(gw, isBoss) {
  const d = curDiff();
  if (isBoss) return [{ t: 1.0, type: 'boss' }];
  const list = [];
  const count = Math.min(28, Math.round(6 + gw * 1.5));
  let t = 0.25;
  const gap = Math.max(0.17, 0.56 - gw * 0.012) * d.rate;
  for (let i = 0; i < count; i++) {
    list.push({ t: t, type: pickType(gw) });
    t += gap * rand(0.7, 1.4);
  }
  return list;
}

function nextWave() {
  state.wave++;
  if (state.wave > WAVES_PER_STAGE) { stageClear(); return; }
  const isBoss = state.wave === WAVES_PER_STAGE;
  spawnList = buildWave(globalWave(), isBoss);
  state.banner = isBoss ? 2.0 : 1.5;
  state.bTitle = isBoss ? 'BOSS' : 'WAVE ' + state.wave + '/' + WAVES_PER_STAGE;
  state.bSub = isBoss ? themeFor(state.stage).boss
    : themeFor(state.stage).name;
  if (isBoss) { state.flash = 0.3; SFX.warn(); }
}

/* =========================================================
   射击 / 子弹
   ========================================================= */
function shoot() {
  const p = player, lvl = p.weapon, spd = 760;
  const add = function (dx, ang, dmg) {
    bullets.push({
      x: p.x + dx, y: p.y - 16,
      vx: Math.sin(ang) * spd, vy: -Math.cos(ang) * spd,
      r: 4, dmg: dmg || 1
    });
  };
  if (lvl === 1) { add(0, 0); }
  else if (lvl === 2) { add(-7, 0); add(7, 0); }
  else if (lvl === 3) { add(0, 0); add(-10, -0.12); add(10, 0.12); }
  else if (lvl === 4) { add(-6, 0); add(6, 0); add(-14, -0.2); add(14, 0.2); }
  else { add(0, 0, 2); add(-8, -0.1); add(8, 0.1); add(-16, -0.26); add(16, 0.26); }
  p.cool = lvl >= 4 ? 0.086 : 0.112;
  SFX.shoot();
}

function aimedShot(e, n, spd, spread) {
  const d = curDiff();
  const base = Math.atan2(player.y - e.y, player.x - e.x);
  const sp = (spread || 0.16);
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * sp;
    ebullets.push({
      x: e.x, y: e.y, vx: Math.cos(a) * spd * d.bullet, vy: Math.sin(a) * spd * d.bullet,
      r: 5.5, t: 0
    });
  }
}
function radialShot(e, n, spd) {
  const d = curDiff();
  for (let i = 0; i < n; i++) {
    const a = TAU * i / n + e.t * 0.6;
    ebullets.push({
      x: e.x, y: e.y, vx: Math.cos(a) * spd * d.bullet, vy: Math.sin(a) * spd * d.bullet,
      r: 5.5, t: 0
    });
  }
}
function fanShot(e, n, spd, arc) {
  const d = curDiff();
  for (let i = 0; i < n; i++) {
    const a = Math.PI / 2 + (i - (n - 1) / 2) * (arc / Math.max(1, n - 1));
    ebullets.push({
      x: e.x, y: e.y, vx: Math.cos(a) * spd * d.bullet, vy: Math.sin(a) * spd * d.bullet,
      r: 6, t: 0
    });
  }
}

let coinFrac = 0, coinChain = 0, coinChainT = 0;
function addCoins(base) {
  const mult = curDiff().coin * (player ? player.coinMul : 1);
  coinFrac += base * mult;
  const whole = Math.floor(coinFrac);
  if (whole <= 0) return 0;

  state.runCoins += whole;

/* =========================================================
   粒子
   ========================================================= */
function burst(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(speed * 0.22, speed);
    const life = rand(0.28, 0.78);
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: life, max: life, r: rand(1.5, 3.8), color: color
    });
  }
  if (particles.length > 700) particles.splice(0, particles.length - 700);
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = 1 - 2.2 * dt;
    p.vx *= damp; p.vy *= damp;
    p.vy += 26 * dt;
  }
}

/* =========================================================
   更新
   ========================================================= */
function updatePlayer(dt) {
  const p = player;
  let ax = 0, ay = 0;
  if (keys.has('ArrowLeft') || keys.has('a')) ax -= 1;
  if (keys.has('ArrowRight') || keys.has('d')) ax += 1;
  if (keys.has('ArrowUp') || keys.has('w')) ay -= 1;
  if (keys.has('ArrowDown') || keys.has('s')) ay += 1;

  if (ax !== 0 || ay !== 0) {
    const len = Math.hypot(ax, ay) || 1;
    p.x += (ax / len) * p.speed * dt;
    p.y += (ay / len) * p.speed * dt;
    pointer.active = false;
  } else if (pointer.active) {
    const tx = pointer.x + pointer.ox;
    const ty = pointer.y + pointer.oy;
    const k = Math.min(1, dt * 22);
    p.x += (clamp(tx, 20, W - 20) - p.x) * k;
    p.y += (clamp(ty, 110, H - 26) - p.y) * k;
  }

  p.x = clamp(p.x, 20, W - 20);
  p.y = clamp(p.y, 108, H - 26);

  p.cool -= dt;
  if (p.cool <= 0) shoot();
  if (p.invuln > 0) p.invuln -= dt;
  if (p.shieldT > 0) p.shieldT -= dt;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) bullets.splice(i, 1);
  }
}
function updateEBullets(dt) {
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.t += dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) ebullets.splice(i, 1);
  }
}

function updateBoss(b, dt) {
  const d = curDiff();
  if (b.y < b.stopY) { b.y += 120 * dt; return; }
  b.x = W / 2 + Math.sin(b.t * 0.75) * 142;
  b.fireT -= dt;
  if (b.fireT <= 0) {
    b.fireT = 1.4 * d.rate;
    const stage = Math.min(8, state.stage);
    b.pattern = (b.pattern + 1) % (stage >= 3 ? 4 : 3);
    if (b.pattern === 0) radialShot(b, 10 + stage * 2, 150);
    else if (b.pattern === 1) aimedShot(b, 3 + Math.min(2, Math.floor(stage / 2)), 220, 0.18);
    else if (b.pattern === 2) fanShot(b, 5 + stage, 172, 1.15);
    else {
      b.spin += 0.55;
      for (let k = 0; k < 3; k++) {
        const a = b.spin + k * TAU / 3;
        ebullets.push({
          x: b.x, y: b.y, vx: Math.cos(a) * 170 * d.bullet, vy: Math.sin(a) * 170 * d.bullet,
          r: 6, t: 0
        });
      }
    }
    toneAt(200, now(), 0.1, 'square', 0.028, 120);
  }
  b.minionT -= dt;
  if (b.minionT <= 0 && enemies.length < 15) {
    b.minionT = 6.5 * d.rate;
    spawnEnemy('grunt');
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    e.t += dt;
    if (e.hitT > 0) e.hitT -= dt;

    if (e.type === 'grunt') {
      e.y += e.vy * dt;
      e.x += Math.sin(e.t * 2.4 + e.phase) * 74 * dt;
    } else if (e.type === 'dart') {
      e.y += e.vy * dt;
      e.x += e.vx * dt;
    } else if (e.type === 'tank') {
      if (e.t > 13) e.y += 90 * dt;
      else if (e.y < e.stopY) e.y += e.vy * dt;
      else e.x += Math.sin(e.t * 1.2 + e.phase) * 62 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 10) { e.fireT = 1.55 * curDiff().rate; aimedShot(e, 2, 196, 0.14); }
    } else if (e.type === 'orb') {
      if (e.t > 13) e.y += 90 * dt;
      else if (e.y < e.stopY) e.y += e.vy * dt;
      else e.x += Math.cos(e.t * 0.9 + e.phase) * 54 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 10) { e.fireT = 2.2 * curDiff().rate; radialShot(e, 8, 146); }
    } else if (e.type === 'boss') {
      updateBoss(e, dt);
    }

    if (!e.boss && (e.y > H + 90 || e.x < -140 || e.x > W + 140)) enemies.splice(i, 1);
  }
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.t += dt;
    p.y += p.vy * dt;
    p.x += Math.sin(p.t * 2.6) * 26 * dt;
    if (p.y > H + 40) powerups.splice(i, 1);
  }
}

function updateCoins(dt) {
  if (coinChainT > 0) coinChainT -= dt; else coinChain = 0;
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.t += dt; c.life -= dt;
    if (c.life <= 0) { coins.splice(i, 1); continue; }
    const dx = player.x - c.x, dy = player.y - c.y;
    const d = Math.hypot(dx, dy) || 1;
    if (c.t > 0.45) {
      const pull = 1500;
      c.vx += (dx / d) * pull * dt;
      c.vy += (dy / d) * pull * dt;
    } else if (d < 135) {
      const pull = 820 * (1 - d / 135);
      c.vx += (dx / d) * pull * dt;
      c.vy += (dy / d) * pull * dt;
    }
    const damp = 1 - 2.4 * dt;
    c.vx *= damp; c.vy *= damp;
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (d < 21) {
      const got = addCoins(c.value);
      coinChain = Math.min(6, coinChain + 1);
      coinChainT = 0.45;
      if (got > 0) SFX.coin(coinChain);
      burst(c.x, c.y, 3, '#ffd166', 110);
      coins.splice(i, 1);
    }
  }
}

function updateSpawner(dt) {
  for (let i = spawnList.length - 1; i >= 0; i--) {
    const s = spawnList[i];
    s.t -= dt;
    if (s.t <= 0) { spawnEnemy(s.type); spawnList.splice(i, 1); }
  }
  if (interWave > 0) {
    interWave -= dt;
    if (interWave <= 0) nextWave();
  } else if (spawnList.length === 0 && enemies.length === 0) {
    interWave = 1.7;
  }
}

/* =========================================================
   伤害 / 结算
   ========================================================= */
function damageEnemy(e, dmg, hx, hy) {
  if (e.dead) return;
  e.hp -= dmg;
  e.hitT = 0.09;
  if (e.hp <= 0) killEnemy(e);
  else { burst(hx, hy, 3, e.color, 130); SFX.hit(); }
}

function killEnemy(e) {
  e.dead = true;
  state.score += e.score;
  if (e.boss) {
    SFX.bigBoom();
    state.shake = 26; state.flash = 0.55;
    const bx = e.x, by = e.y;
    for (let i = 0; i < 5; i++) {
      setTimeout(function () {
        burst(bx + rand(-54, 54), by + rand(-44, 44), 22, pick(['#ffd166', '#ff6b8a', '#ffffff']), 400);
      }, i * 90);
    }
    boss = null;
    spawnCoins(e.x, e.y, 12, 3);
    dropPowerup(e.x - 52, e.y, 'weapon');
    dropPowerup(e.x, e.y - 10, 'shield');
    dropPowerup(e.x + 52, e.y, 'bomb');
    setTimeout(function () { if (state.mode === 'playing') stageClear(); }, 1200);
  } else {
    SFX.boom();
    state.shake = Math.min(15, state.shake + 4);
    burst(e.x, e.y, 15, e.color, 250);
    spawnCoins(e.x, e.y, e.coins || 1, 1);
    maybeDrop(e);
  }
}

function playerHit() {
  const p = player;
  if (p.invuln > 0 || state.mode !== 'playing') return;
  if (p.shieldT > 0) {
    p.shieldT = 0; p.invuln = 1.0;
    state.shake = 10;
    burst(p.x, p.y, 18, '#7ce9ff', 240);
    SFX.shield();
    return;
  }
  p.hp--;
  p.invuln = 1.8;
  state.shake = 17;
  state.flash = 0.45;
  SFX.hurt();
  burst(p.x, p.y, 26, '#ff8a8a', 280);
  if (p.weapon > 1) p.weapon--;
  if (p.hp <= 0) gameOver();
}

function useBomb() {
  const p = player;
  if (state.mode !== 'playing' || p.bombs <= 0) return;
  p.bombs--;
  state.flash = 0.95;
  state.shake = 24;
  SFX.bomb();
  ebullets.length = 0;
  const list = enemies.slice();
  for (let i = 0; i < list.length; i++) damageEnemy(list[i], 14, list[i].x, list[i].y);
  for (let i = 0; i < 46; i++) {
    burst(rand(0, W), rand(0, H * 0.85), 1, pick(['#ffd166', '#ff8fab', '#8df3ff']), 340);
  }
}

function collide() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (e.dead) continue;
      const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        damageEnemy(e, b.dmg, b.x, b.y);
        bullets.splice(i, 1);
        break;
      }
    }
  }
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    const dx = player.x - b.x, dy = player.y - b.y, rr = player.r + b.r;
    if (dx * dx + dy * dy < rr * rr) {
      ebullets.splice(i, 1);
      playerHit();
    }
  }
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y, rr = e.r + player.r;
    if (dx * dx + dy * dy < rr * rr) {
      damageEnemy(e, 4, e.x, e.y);
      playerHit();
    }
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    const dx = pu.x - player.x, dy = pu.y - player.y, rr = pu.r + player.r + 6;
    if (dx * dx + dy * dy < rr * rr) {
      applyPowerup(pu);
      powerups.splice(i, 1);
    }
  }
}

function stageClear() {
  if (state.mode !== 'playing') return;
  state.mode = 'clear';
  BGM.stop();
  SFX.clear();
  ebullets.length = 0;
  for (let i = 0; i < enemies.length; i++) burst(enemies[i].x, enemies[i].y, 10, '#9fe8ff', 260);
  enemies.length = 0;
  spawnList.length = 0;
  for (let i = 0; i < coins.length; i++) addCoins(coins[i].value);
  coins.length = 0;

  const bonus = Math.min(500, 100 + state.stage * 12);
  const before = SAVE.coins;
  addCoins(bonus);
  state.lastBonus = SAVE.coins - before;
  state.lastBaseBonus = bonus;

  SAVE.maxStage = Math.max(SAVE.maxStage, state.stage);
  if (state.score > SAVE.best) SAVE.best = state.score;
  SAVE.stageBest[state.stage] = Math.max(SAVE.stageBest[state.stage] || 0, state.score);
  persist();

  clearTimeout(overTimer);
  overTimer = setTimeout(showClearPanel, 900);
}

function gameOver() {
  state.mode = 'over';
  BGM.stop();
  SFX.bigBoom();
  state.shake = 28;
  state.flash = 0.8;
  for (let i = 0; i < 36; i++) {
    burst(player.x, player.y, 1, pick(['#ffd166', '#ff8fab', '#8df3ff', '#ffffff']), 430);
  }
  if (state.score > SAVE.best) SAVE.best = state.score;
  SAVE.maxStage = Math.max(SAVE.maxStage, state.stage - 1);
  persist();
  clearTimeout(overTimer);
  overTimer = setTimeout(showOverPanel, 900);
}

const MAX_REVIVES = 5;
function reviveCost() { return 10; }

function revive() {
  if (state.mode !== 'over' || state.revives >= MAX_REVIVES) return;
  const cost = reviveCost();
  if (SAVE.coins < cost) {
    SFX.deny();
    toast(t('toast_poor', { n: cost - SAVE.coins }));
    return;
  }
  SAVE.coins -= cost;
  state.revives++;
  persist();
  clearTimeout(overTimer);

  const sk = curSkin();
  player.hp = sk.hp;
  player.maxhp = sk.hp;
  player.weapon = sk.weapon;
  player.invuln = 2.5;
  player.shieldT = Math.max(player.shieldT, 2.5);
  player.bombs = Math.min(3, player.bombs + 1);
  player.x = W / 2;
  player.y = H - 110;
  ebullets.length = 0;
  state.shake = 0;
  state.flash = 0;
  state.mode = 'playing';
  hideOverlay();
  const ac = AC();
  if (ac && ac.state === 'suspended') ac.resume();
  BGM.start();
  SFX.power();
  burst(player.x, player.y, 30, '#8df3ff', 320);
  toast(t('toast_revive_ok'));
}

/* =========================================================
   主循环
   ========================================================= */
function update(dt) {
  state.shake = Math.max(0, state.shake - dt * 34);
  state.flash = Math.max(0, state.flash - dt * 2.6);
  if (state.banner > 0) state.banner -= dt;
  if (coinSaveT > 0) { coinSaveT -= dt; if (coinSaveT <= 0) persist(); }
  autoSaveT += dt;
  if (autoSaveT >= 4) { autoSaveT = 0; persist(); }

  updateStars(dt);
  updateParticles(dt);

  if (state.mode !== 'playing') return;
  state.time += dt;
  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateEBullets(dt);
  updatePowerups(dt);
  updateCoins(dt);
  updateSpawner(dt);
  collide();
}

let lastTs = 0;
function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   绘制
   ========================================================= */
const glowCache = {};
function glow(color, size) {
  const key = color + '|' + size;
  if (glowCache[key]) return glowCache[key];
  const c = document.createElement('canvas');
  c.width = c.height = size * 2;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size, size, 0, size, size, size);
  grd.addColorStop(0, 'rgba(255,255,255,.95)');
  grd.addColorStop(0.22, color);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(size, size, size, 0, TAU); g.fill();
  glowCache[key] = c;
  return c;
}
function poly(n, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + TAU * i / n;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function star4(r1, r2) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + Math.PI * i / 4;
    const r = i % 2 === 0 ? r1 : r2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.72);
  ctx.bezierCurveTo(-s * 1.15, -s * 0.15, -s * 0.62, -s * 1.1, 0, -s * 0.42);
  ctx.bezierCurveTo(s * 0.62, -s * 1.1, s * 1.15, -s * 0.15, 0, s * 0.72);
  ctx.closePath();
}

function drawBg() {
  ctx.drawImage(nebulaFor(state.mode === 'menu' ? 1 : state.stage), 0, 0);
  ctx.save();
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const tw = 0.62 + 0.38 * Math.sin(T * 2.2 + s.ph);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#cfe9ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

let shotSprite = null, orbSprite = null;
function makeShotSprite() {
  const c = document.createElement('canvas');
  c.width = 18; c.height = 34;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 34);
  grd.addColorStop(0, 'rgba(120,235,255,0)');
  grd.addColorStop(0.45, 'rgba(120,235,255,.85)');
  grd.addColorStop(1, 'rgba(235,255,255,.98)');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(9, 17, 3.4, 16, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,.95)';
  g.beginPath(); g.ellipse(9, 19, 1.4, 12, 0, 0, TAU); g.fill();
  return c;
}
function makeOrbSprite() {
  const c = document.createElement('canvas');
  c.width = c.height = 22;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(11, 11, 0, 11, 11, 11);
  grd.addColorStop(0, 'rgba(255,255,255,.98)');
  grd.addColorStop(0.3, 'rgba(255,120,160,.92)');
  grd.addColorStop(1, 'rgba(255,50,100,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(11, 11, 11, 0, TAU); g.fill();
  return c;
}

function drawBullets() {
  if (!shotSprite) shotSprite = makeShotSprite();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    ctx.drawImage(shotSprite, b.x - 9, b.y - 26);
  }
  ctx.restore();
}

function drawEBullets() {
  if (!orbSprite) orbSprite = makeOrbSprite();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < ebullets.length; i++) {
    const b = ebullets[i];
    ctx.drawImage(orbSprite, b.x - 11, b.y - 11);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(255,245,250,.95)';
  for (let i = 0; i < ebullets.length; i++) {
    const b = ebullets[i];
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.1, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawCoins() {
  ctx.save();
  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.life < 2.2 && Math.floor(c.life * 8) % 2 === 0) continue;
    const s = c.value >= 3 ? 1.35 : 1;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(Math.sin(c.t * 3) * 0.25);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glow('rgba(255,190,60,.65)', 18 * s), -18 * s, -18 * s, 36 * s, 36 * s);
    ctx.restore();
    ctx.beginPath();
    ctx.arc(0, 0, c.r * s, 0, TAU);
    const g = ctx.createLinearGradient(-c.r, -c.r, c.r, c.r);
    g.addColorStop(0, '#fff6c2');
    g.addColorStop(0.5, '#ffc247');
    g.addColorStop(1, '#c1871a');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,180,.9)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, c.r * 0.42 * s, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === 'boss') {
      const tint = e.color;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow(hexA(tint, 0.42), 96), -96, -96);
      ctx.restore();

      ctx.beginPath();
      ctx.moveTo(0, -50); ctx.lineTo(44, -26); ctx.lineTo(54, 8);
      ctx.lineTo(28, 44); ctx.lineTo(-28, 44); ctx.lineTo(-54, 8);
      ctx.lineTo(-44, -26); ctx.closePath();
      const bg = ctx.createLinearGradient(0, -50, 0, 44);
      bg.addColorStop(0, hexA(tint, 0.95));
      bg.addColorStop(0.55, hexA(tint, 0.34));
      bg.addColorStop(1, 'rgba(6,4,14,.98)');
      ctx.fillStyle = bg; ctx.fill();
      if (e.hitT > 0) { ctx.fillStyle = 'rgba(255,255,255,.32)'; ctx.fill(); }
      ctx.lineWidth = 2;
      ctx.strokeStyle = hexA(tint, 0.9);
      ctx.stroke();
      ctx.strokeStyle = hexA(tint, 0.35);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-34, -8); ctx.lineTo(34, -8);
      ctx.moveTo(-26, 20); ctx.lineTo(26, 20);
      ctx.stroke();

      ctx.fillStyle = hexA(tint, 0.35);
      ctx.beginPath(); ctx.arc(-38, 2, 11, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(38, 2, 11, 0, TAU); ctx.fill();

      const pulse = 1 + Math.sin(e.t * 5) * 0.13;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow(hexA(tint, 0.85), 34), -34, -34);
      ctx.restore();
      ctx.fillStyle = tint;
      ctx.beginPath(); ctx.arc(0, 0, 15 * pulse, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, 6.5 * pulse, 0, TAU); ctx.fill();
    } else if (e.type === 'grunt') {
      ctx.rotate(Math.sin(e.t * 2.2) * 0.22);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow(hexA(e.color, 0.55), 30), -30, -30);
      ctx.restore();
      ctx.fillStyle = e.hitT > 0 ? '#fff' : '#c9279f';
      star4(e.r + 4, e.r * 0.42); ctx.fill();
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,255,.95)';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.26, 0, TAU); ctx.fill();
    } else if (e.type === 'dart') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow(hexA(e.color, 0.5), 26), -26, -26);
      ctx.restore();
      ctx.fillStyle = e.hitT > 0 ? '#fff' : '#d96a12';
      poly(3, e.r + 3, Math.PI / 2); ctx.fill();
      ctx.strokeStyle = e.color; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,200,.95)';
      poly(3, e.r * 0.4, Math.PI / 2); ctx.fill();
    } else if (e.type === 'tank') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow(hexA(e.color, 0.42), 40), -40, -40);
      ctx.restore();
      ctx.fillStyle = e.hitT > 0 ? '#fff' : '#3c1f66';
      poly(6, e.r, 0); ctx.fill();
      ctx.strokeStyle = e.color; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.42, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(20,6,34,.9)';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.2, 0, TAU); ctx.fill();
    } else if (e.type === 'orb') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glow(hexA(e.color, 0.45), 34), -34, -34);
      ctx.restore();
      ctx.fillStyle = e.hitT > 0 ? '#fff' : '#0f3b2a';
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = e.color; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.strokeStyle = hexA(e.color, 0.55);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, e.r + 5, e.t * 2, e.t * 2 + Math.PI * 1.15);
      ctx.stroke();
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.34, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPowerups() {
  for (let i = 0; i < powerups.length; i++) {
    const pu = powerups[i];
    const col = pu.type === 'weapon' ? '#5ce1ff'
      : pu.type === 'shield' ? '#7cf0d0'
      : pu.type === 'bomb' ? '#ffd166' : '#ff7ba8';
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glow(hexA(col, 0.5), 30), -30, -30);
    ctx.restore();

    ctx.rotate(Math.sin(pu.t * 2) * 0.2);
    ctx.beginPath();
    ctx.arc(0, 0, pu.r, 0, TAU);
    ctx.fillStyle = 'rgba(6,14,24,.86)';
    ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.rotate(-Math.sin(pu.t * 2) * 0.2);

    ctx.fillStyle = col;
    if (pu.type === 'weapon') {
      poly(3, 9, -Math.PI / 2); ctx.fill();
    } else if (pu.type === 'shield') {
      ctx.lineWidth = 2.8; ctx.strokeStyle = col;
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.stroke();
    } else if (pu.type === 'bomb') {
      ctx.beginPath(); ctx.arc(0, 1, 5.6, 0, TAU); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(1, -4); ctx.quadraticCurveTo(6, -8, 4, -11); ctx.stroke();
    } else {
      ctx.save(); ctx.scale(1.35, 1.35); heartPath(6); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }
}

function drawPlayer() {
  const p = player;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.invuln > 0 && Math.floor(T * 16) % 2 === 0) ctx.globalAlpha = 0.42;

  if (p.shieldT > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(T * 7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(120,240,255,' + (0.35 + pulse * 0.35) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
    ctx.setLineDash([6, 9]);
    ctx.lineDashOffset = -T * 40;
    ctx.strokeStyle = 'rgba(180,255,255,.6)';
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  paintShip(ctx, p.sk, T, 1);
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.35 + a * 0.9), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

/* =========================================================
   HUD
   ========================================================= */
const BTN = {
  pause: { x: W - 30, y: 32, r: 17 },
  mute: { x: W - 68, y: 32, r: 17 },
  bomb: { x: W - 44, y: H - 48, r: 23 }
};

function drawHud() {
  ctx.save();
  const scrim = ctx.createLinearGradient(0, 0, 0, 132);
  scrim.addColorStop(0, 'rgba(4,6,15,.84)');
  scrim.addColorStop(0.68, 'rgba(4,6,15,.4)');
  scrim.addColorStop(1, 'rgba(4,6,15,0)');
  ctx.fillStyle = scrim;
  ctx.fillRect(0, 0, W, 132);

  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(150,205,240,.55)';
  ctx.font = '500 11px ' + FONT;
  ctx.fillText(t('score'), 18, 26);
  ctx.fillStyle = '#eaf9ff';
  ctx.font = '700 25px ' + MONO;
  ctx.fillText(pad5(state.score), 18, 53);

  // 金币
  const cy = 77;
  const cg = ctx.createRadialGradient(26, cy - 2, 0, 26, cy, 8);
  cg.addColorStop(0, '#fff7c9');
  cg.addColorStop(0.55, '#ffc247');
  cg.addColorStop(1, '#c1871a');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(26, cy, 7.5, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,217,122,.95)';
  ctx.font = '700 15px ' + MONO;
  ctx.fillText(String(SAVE.coins), 40, cy + 5);

  ctx.fillStyle = 'rgba(150,205,240,.38)';
  ctx.font = '500 10.5px ' + MONO;
  ctx.fillText('BEST ' + pad5(SAVE.best), 18, 101);

  // 关卡
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(150,205,240,.45)';
  ctx.font = '600 9.5px ' + FONT;
  ctx.fillText(stageCode(state.stage), W / 2, 22);
  for (let i = 1; i <= WAVES_PER_STAGE; i++) {
    const dx = W / 2 + (i - (WAVES_PER_STAGE + 1) / 2) * 17;
    const on = i <= state.wave;
    const isBoss = i === WAVES_PER_STAGE;
    ctx.beginPath();
    if (isBoss) {
      const r = on ? 6 : 4.5;
      ctx.moveTo(dx, 40 - r); ctx.lineTo(dx + r, 40); ctx.lineTo(dx, 40 + r); ctx.lineTo(dx - r, 40);
      ctx.closePath();
    } else {
      ctx.arc(dx, 40, on ? 4 : 3, 0, TAU);
    }
    ctx.fillStyle = on ? (isBoss ? '#ff6b8a' : '#8df3ff') : 'rgba(150,205,240,.22)';
    ctx.fill();
  }

  // 暂停 / 静音
  ctx.strokeStyle = 'rgba(140,210,255,.32)';
  ctx.lineWidth = 1.4;
  ctx.fillStyle = 'rgba(10,24,44,.55)';
  [BTN.pause, BTN.mute].forEach(function (b) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
  });
  ctx.fillStyle = 'rgba(190,235,255,.9)';
  ctx.fillRect(BTN.pause.x - 5, BTN.pause.y - 6, 3.4, 12);
  ctx.fillRect(BTN.pause.x + 1.6, BTN.pause.y - 6, 3.4, 12);

  const mx = BTN.mute.x, my = BTN.mute.y;
  ctx.beginPath();
  ctx.moveTo(mx - 7, my - 3.5); ctx.lineTo(mx - 3, my - 3.5);
  ctx.lineTo(mx + 2, my - 8); ctx.lineTo(mx + 2, my + 8);
  ctx.lineTo(mx - 3, my + 3.5); ctx.lineTo(mx - 7, my + 3.5);
  ctx.closePath();
  ctx.fillStyle = muted ? 'rgba(150,180,200,.45)' : 'rgba(190,235,255,.9)';
  ctx.fill();
  ctx.strokeStyle = muted ? 'rgba(255,120,140,.9)' : 'rgba(190,235,255,.6)';
  ctx.lineWidth = 1.6;
  if (muted) {
    ctx.beginPath(); ctx.moveTo(mx - 4, my + 8); ctx.lineTo(mx + 7, my - 8); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(mx + 2, my, 6, -0.9, 0.9); ctx.stroke();
  }

  // 生命
  const hearts = Math.max(0, player ? player.hp : 0);
  for (let i = 0; i < hearts; i++) {
    ctx.save();
    ctx.translate(26 + i * 21, H - 26);
    heartPath(8);
    ctx.fillStyle = '#ff5f8f';
    ctx.shadowColor = 'rgba(255,80,140,.8)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.restore();
  }

  // 炸弹
  const b = BTN.bomb;
  const has = player && player.bombs > 0;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fillStyle = has ? 'rgba(60,44,10,.62)' : 'rgba(30,34,44,.5)';
  ctx.fill();
  ctx.strokeStyle = has ? 'rgba(255,209,102,.75)' : 'rgba(140,160,180,.25)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.save();
  ctx.translate(b.x, b.y + 1);
  ctx.beginPath(); ctx.arc(0, 2, 7, 0, TAU);
  ctx.fillStyle = has ? '#ffd166' : 'rgba(150,160,175,.45)';
  ctx.fill();
  ctx.strokeStyle = has ? '#ffd166' : 'rgba(150,160,175,.45)';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(2, -6); ctx.quadraticCurveTo(9, -12, 6, -17); ctx.stroke();
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillStyle = has ? '#ffe9b0' : 'rgba(180,195,210,.5)';
  ctx.font = '700 11px ' + MONO;
  ctx.fillText('x' + (player ? player.bombs : 0), b.x, b.y + 22);

  // BOSS 血条
  if (boss && boss.y > -30) {
    const bw = W - 120, bx = 60, by = 118;
    const ratio = Math.max(0, boss.hp / boss.maxhp);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.fillRect(bx, by, bw, 7);
    const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grd.addColorStop(0, boss.color);
    grd.addColorStop(1, hexA(boss.color, 0.45));
    ctx.fillStyle = grd;
    ctx.fillRect(bx, by, bw * ratio, 7);
    ctx.strokeStyle = hexA(boss.color, 0.5);
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 6);
    ctx.fillStyle = 'rgba(255,190,205,.8)';
    ctx.font = '600 9px ' + FONT;
    ctx.textAlign = 'left';
    ctx.fillText('BOSS', bx, by - 5);
  }
  ctx.restore();
}

function drawBanner() {
  if (state.mode !== 'playing' || state.banner <= 0) return;
  const a = Math.min(1, state.banner / 0.22);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(90,215,255,.85)';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#d8f7ff';
  ctx.font = '700 34px ' + MONO;
  ctx.fillText(state.bTitle, W / 2, H / 2 - 26);
  ctx.shadowBlur = 10;
  ctx.fillStyle = 'rgba(190,235,255,.9)';
  ctx.font = '600 13px ' + FONT;
  ctx.fillText(state.bSub, W / 2, H / 2 + 2);
  ctx.restore();
}

function render() {
  ctx.save();
  if (state.shake > 0 && SAVE.shake) {
    ctx.translate(rand(-1, 1) * state.shake * 0.45, rand(-1, 1) * state.shake * 0.45);
  }
  drawBg();
  drawPowerups();
  drawCoins();
  drawEnemies();
  drawEBullets();
  drawBullets();
  if (state.mode === 'playing' || state.mode === 'paused' || state.mode === 'clear') drawPlayer();
  drawParticles();
  ctx.restore();

  if (state.mode !== 'menu') drawHud();
  drawBanner();

  if (state.flash > 0 && SAVE.flash) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.6, state.flash * 0.6) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function stopAd() {
  if (adRAF) { cancelAnimationFrame(adRAF); adRAF = 0; }
}

function startAd() {
  adDone = false; adCue = {};
  stopAd();
  showScreen(adIntroHTML());
  SFX.ui();
}

function beginAd() {
  adDone = false; adCue = {};
  showScreen(adPlayingHTML());
  adStart = performance.now();
  adRAF = requestAnimationFrame(adLoop);
  SFX.ui();
}

function finishAd() {
  adDone = true;
  stopAd();
  SAVE.coins += AD_REWARD;
  persist();
  SFX.clear();
  showScreen(adDoneHTML());
  toast(t('toast_ad_reward', { n: AD_REWARD }));
}

function adLoop() {
  const cv = document.getElementById('adCv');
  adRAF = requestAnimationFrame(adLoop);
  const el = Math.min(AD_SECONDS, (performance.now() - adStart) / 1000);

  // 倒计时与进度条先更新，避免画布绘制异常时一并卡住
  const left = Math.max(0, AD_SECONDS - el);
  const tag = document.getElementById('adTag');
  if (tag) tag.textContent = t('ad_tag', { n: Math.ceil(left) });
  const bar = document.getElementById('adBar');
  if (bar) bar.style.width = Math.min(100, (el / AD_SECONDS) * 100) + '%';

  if (cv) {
    try {
      const g = cv.getContext('2d');
      if (g) drawAd(g, cv.width, cv.height, el, t);
    } catch (err) { /* 单帧绘制失败不中断广告流程 */ }
  }

  if (el > 3 && !adCue.p) { adCue.p = 1; SFX.power(); }
  if (el > 7 && !adCue.c) { adCue.c = 1; SFX.coin(3); }
  if (el > 11.5 && !adCue.d) { adCue.d = 1; SFX.coin(5); }
  if (el > AD_SECONDS - 3 && !adCue.w) { adCue.w = 1; SFX.warn(); }

  if (el >= AD_SECONDS && !adDone) finishAd();
}

function adPill(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
  g.lineTo(x + r, y + h);
  g.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5);
  g.closePath();
  g.fill();
}

function drawAd(g, w, h, t, tr) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  g.textBaseline = 'alphabetic';
  g.textAlign = 'left';

  const bg = g.createLinearGradient(0, 0, w * 0.7, h);
  bg.addColorStop(0, '#0a2246');
  bg.addColorStop(0.55, '#06122a');
  bg.addColorStop(1, '#03060e');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);

  const neb = 0.16 + Math.sin(t * 0.6) * 0.05;
  let rg = g.createRadialGradient(w * 0.82, h * 0.2, 0, w * 0.82, h * 0.2, w * 0.55);
  rg.addColorStop(0, 'rgba(96,206,255,' + neb.toFixed(3) + ')');
  rg.addColorStop(1, 'rgba(96,206,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
  rg = g.createRadialGradient(w * 0.16, h * 0.86, 0, w * 0.16, h * 0.86, w * 0.45);
  rg.addColorStop(0, 'rgba(120,120,255,' + (neb * 0.9).toFixed(3) + ')');
  rg.addColorStop(1, 'rgba(120,120,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);

  for (let i = 0; i < 46; i++) {
    const x = (i * 137) % w;
    const spd = 70 + (i % 6) * 50;
    const y = ((((i * 71) % h) + t * spd) % (h + 40)) - 20;
    const len = 10 + (i % 7) * 8;
    g.strokeStyle = 'rgba(180,225,255,' + (0.16 + (i % 5) * 0.1).toFixed(2) + ')';
    g.lineWidth = 1 + (i % 3) * 0.4;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 3, y + len); g.stroke();
  }

  const cx = w * 0.62, cy = h * 0.5;
  g.save();
  g.translate(cx, cy);
  g.strokeStyle = 'rgba(120,225,255,.34)';
  g.lineWidth = 2;
  g.beginPath(); g.ellipse(0, 26, 132, 40, t * 0.2, 0, TAU); g.stroke();
  g.strokeStyle = 'rgba(140,255,220,.26)';
  g.lineWidth = 1.4;
  g.beginPath(); g.ellipse(0, 30, 88, 26, -t * 0.35, 0, TAU); g.stroke();
  g.restore();

  const bob = Math.sin(t * 1.7) * 7;
  const sx = cx + Math.sin(t * 0.9) * 10;
  // 广告内轮换展示全部皮肤，不再一直显示当前装备款
  const SHOW_EVERY = 1.6;
  const showIdx = Math.floor(t / SHOW_EVERY) % SKINS.length;
  const showSkin = SKINS[showIdx];
  const slotPhase = (t % SHOW_EVERY) / SHOW_EVERY;
  const pop = 1 + Math.sin(Math.min(slotPhase, 1) * Math.PI) * 0.12;
  g.save();
  g.translate(sx, cy + bob);
  g.rotate(Math.sin(t * 1.1) * 0.1);
  g.scale(pop, pop);
  paintShip(g, showSkin, t * 4, 4.2);
  g.restore();

  g.globalAlpha = 0.5;
  g.strokeStyle = 'rgba(160,230,255,.75)';
  for (let i = 0; i < 5; i++) {
    const lx = sx - 46 + i * 24;
    const ly = cy + 62 + ((t * 60 + i * 18) % 60);
    g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(lx, ly); g.lineTo(lx, ly + 22); g.stroke();
  }
  g.globalAlpha = 1;

  const pIn = clamp((t - 0.6) / 1.0, 0, 1);
  const ease = 1 - Math.pow(1 - pIn, 3);
  g.save();
  g.globalAlpha = ease;
  g.translate(0, (1 - ease) * 22);
  g.font = '800 46px "Noto Sans SC","PingFang SC",system-ui,sans-serif';
  g.shadowColor = 'rgba(110,220,255,.85)';
  g.shadowBlur = 18;
  g.fillStyle = '#ffffff';
  g.fillText(tr('ad_creative'), 40, h * 0.7);
  g.shadowBlur = 0;
  g.font = '600 15px system-ui,sans-serif';
  g.fillStyle = 'rgba(150,220,255,.78)';
  g.fillText('S T A R F U E L   E N E R G Y', 42, h * 0.7 + 28);
  g.restore();

  const pB = clamp((t - 2.2) / 0.55, 0, 1);
  if (pB > 0) {
    g.save();
    g.globalAlpha = pB;
    g.translate(w * 0.19, h * 0.22);
    g.rotate(-0.1 + Math.sin(t * 2) * 0.03);
    const bgr = g.createLinearGradient(-70, 0, 70, 0);
    bgr.addColorStop(0, '#ffe9a8');
    bgr.addColorStop(1, '#ffb020');
    g.fillStyle = bgr;
    adPill(g, -72, -26, 144, 52, 26);
    g.fillStyle = '#3a2400';
    g.font = '800 20px "Noto Sans SC",system-ui,sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(tr('ad_badge'), 0, 0);
    g.textBaseline = 'alphabetic';
    g.restore();
  }

  if (t > 4.2) {
    const pulse = 1 + Math.sin(t * 5) * 0.035;
    g.save();
    g.globalAlpha = clamp((t - 4.2) / 0.7, 0, 1);
    g.translate(w * 0.5, h - 50);
    g.scale(pulse, pulse);
    const cg = g.createLinearGradient(-120, 0, 120, 0);
    cg.addColorStop(0, '#7ce9ff');
    cg.addColorStop(1, '#3f8bff');
    g.fillStyle = cg;
    adPill(g, -118, -22, 236, 44, 22);
    g.fillStyle = '#04121f';
    g.font = '700 18px "Noto Sans SC",system-ui,sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(tr('ad_cta'), 0, 0);
    g.textBaseline = 'alphabetic';
    g.restore();
  }

  if (t > 5.2) {
    for (let i = 0; i < 12; i++) {
      const ph = (t * 0.5 + i * 0.31) % 1;
      const x = w * 0.87 + Math.sin(i * 2.2 + t * 0.8) * 26;
      const y = h * 0.96 - ph * (h * 0.78);
      g.save();
      g.globalAlpha = Math.sin(ph * Math.PI) * 0.85;
      g.fillStyle = '#ffd166';
      g.beginPath(); g.arc(x, y, 5.5, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.8)';
      g.beginPath(); g.arc(x - 1.4, y - 1.8, 2, 0, TAU); g.fill();
      g.restore();
    }
  }

  const pF = clamp((t - (AD_SECONDS - 3)) / 0.55, 0, 1);
  if (pF > 0) {
    g.save();
    g.globalAlpha = pF;
    g.fillStyle = '#03060f';
    g.fillRect(0, 0, w, h);
    g.globalAlpha = pF;
    const burst = 1 + Math.sin(t * 8) * 0.05;
    g.save();
    g.translate(w / 2, h / 2 - 42);
    g.scale(burst, burst);
    const coin = g.createRadialGradient(-8, -10, 2, 0, 0, 42);
    coin.addColorStop(0, '#fffdf0');
    coin.addColorStop(0.55, '#ffd166');
    coin.addColorStop(1, '#c98a12');
    g.fillStyle = coin;
    g.beginPath(); g.arc(0, 0, 38, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)';
    g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 32, 0, TAU); g.stroke();
    g.restore();
    g.textAlign = 'center';
    g.fillStyle = '#ffffff';
    g.font = '800 34px "Noto Sans SC",system-ui,sans-serif';
    g.fillText(tr('ad_reward_line', { n: AD_REWARD }), w / 2, h / 2 + 34);
    g.font = '600 15px system-ui,sans-serif';
    g.fillStyle = 'rgba(150,225,255,.72)';
    g.fillText(tr('ad_reward_loading'), w / 2, h / 2 + 66);
    g.restore();
  }
}

function stageUnlocked(n) {
  if (n <= 1) return true;
  if (SAVE.maxStage >= n - 1) return true;
  return Array.isArray(SAVE.unlocked) && SAVE.unlocked.indexOf(n) >= 0;
}
function payFrontier() {
  for (let n = 2; n <= TOTAL_STAGES; n++) if (!stageUnlocked(n)) return n;
  return -1;
}
function canPayUnlock(n) {
  return n === payFrontier();
}

let selPage = 0;
const PAGE_SIZE = 12;

function stagesHTML() {
  const total = TOTAL_STAGES;
  const cleared = Math.min(total, SAVE.maxStage);
  const cur = Math.min(total, Math.max(1, SAVE.maxStage + 1));
  const pageCount = Math.ceil(total / PAGE_SIZE);
  if (selPage < 0 || selPage >= pageCount) selPage = Math.floor((cur - 1) / PAGE_SIZE);
  const start = selPage * PAGE_SIZE + 1;
  const end = Math.min(total, start + PAGE_SIZE - 1);
  let rows = '';
  for (let n = start; n <= end; n++) {
    const st = themeFor(n);
    const isCleared = SAVE.maxStage >= n;
    const open = stageUnlocked(n);
    const pay = canPayUnlock(n);
    const afford = SAVE.coins >= UNLOCK_COST;
    const best = SAVE.stageBest[n] || 0;
    let cls, txt, actionAttr;
    if (isCleared) { cls = 'clear'; txt = t('st_cleared'); actionAttr = ' data-action="stage" data-stage="' + n + '"'; }
    else if (open) { cls = 'now'; txt = t('st_open'); actionAttr = ' data-action="stage" data-stage="' + n + '"'; }
    else if (pay) { cls = 'pay'; txt = afford ? t('st_pay', { n: UNLOCK_COST }) : t('st_poor'); actionAttr = ' data-action="unlock" data-stage="' + n + '"'; }
    else { cls = 'lock'; txt = t('st_lock'); actionAttr = ''; }
    rows += '<div class="scard' + (open || pay ? '' : ' lock') + (open && !isCleared ? ' cur' : '') + (pay ? ' pay' : '') + '"' + actionAttr + '>' +
      '<div class="snum">' + String(n).padStart(3, '0') + '</div>' +
      '<div class="sbody"><div class="sname">' + st.name + '</div>' +
        '<div class="sboss">BOSS ' + st.boss + (best ? ' · ' + t('best') + ' ' + best : '') + '</div></div>' +
      '<div class="sstate ' + cls + '">' + txt + '</div>' +
    '</div>';
  }
  const endlessOpen = SAVE.maxStage >= total;
  rows += '<div class="scard' + (endlessOpen ? ' cur' : ' lock') + '"' +
    (endlessOpen ? ' data-action="endless"' : '') + '>' +
    '<div class="snum inf">∞</div>' +
    '<div class="sbody"><div class="sname">' + t('endless_name') + '</div>' +
      '<div class="sboss">' + (endlessOpen ? t('endless_open') : t('endless_lock', { total: total })) + '</div></div>' +
    '<div class="sstate ' + (endlessOpen ? 'now' : 'lock') + '">' + (endlessOpen ? t('st_open') : t('st_lock')) + '</div>' +
  '</div>';

  const pager =
    '<div class="pager">' +
      '<button class="mini" data-action="page" data-dir="-1"' + (selPage <= 0 ? ' disabled' : '') + '>' + t('prev') + '</button>' +
      '<span class="pager-info">' + t('pager', { start: start, end: end, p: selPage + 1, total: pageCount }) + '</span>' +
      '<button class="mini" data-action="page" data-dir="1"' + (selPage >= pageCount - 1 ? ' disabled' : '') + '>' + t('next') + '</button>' +
    '</div>';

  return '<div class="panel wide">' +
    '<div class="hdr"><h2>' + t('stages_title') + '</h2>' + walletHTML() + '</div>' +
    '<div class="sprog">' + t('sprog', { cleared: cleared, total: total, cur: cur, diff: t('diff_' + curDiff().id) }) + '</div>' +
    pager +
    '<div class="slist">' + rows + '</div>' +
    '<button class="btn ghost gold-text" data-action="ad">' + t('ad_coin', { n: AD_REWARD }) + '</button>' +
    '<button class="btn ghost" data-action="diff">' + t('switch_diff') + '</button>' +
    '<button class="btn ghost" data-action="home">' + t('back_home') + '</button>' +
  '</div>';
}

function buySkin(id) {
  const sk = skinById(id);
  if (SAVE.owned.indexOf(id) >= 0) return;
  if (SAVE.coins < sk.price) {
    SFX.deny();
    toast(t('toast_poor_ad', { n: sk.price - SAVE.coins, ad: AD_REWARD }));
    return;
  }
  SAVE.coins -= sk.price;
  SAVE.owned.push(id);
  SAVE.skin = id;
  persist();
  SFX.buy();
  toast(t('toast_skin_bought', { name: sk.name }));
  showScreen(shopHTML());
}

function equipSkin(id) {
  if (SAVE.owned.indexOf(id) < 0) return;
  SAVE.skin = id;
  persist();
  SFX.ui();
  toast(t('toast_skin_equipped', { name: skinById(id).name }));
  showScreen(shopHTML());
}

function setDiff(id) {
  SAVE.diff = id;
  persist();
  SFX.ui();
  showScreen(diffHTML());
  toast(t('toast_diff', { name: t('diff_' + curDiff().id) }));
}

/* =========================================================
   流程控制
   ========================================================= */
function startGame(stageNo) {
  const ac = AC();
  if (ac && ac.state === 'suspended') ac.resume();
  clearTimeout(overTimer);
  startStage(stageNo || 1);
  const st = themeFor(state.stage);
  state.banner = 2.2;
  state.bTitle = stageCode(state.stage);
  state.bSub = st.name;
  interWave = 2.4;
}

function togglePause() {
  if (state.mode === 'playing') {
    state.mode = 'paused';
    pointer.active = false;
    persist();
    BGM.stop();
    showScreen(pauseHTML());
  } else if (state.mode === 'paused') {
    state.mode = 'playing';
    hideOverlay();
    BGM.start();
  }
}

function toggleMute() {
  setMuted(!muted);
  if (!muted) { AC(); SFX.ui(); }
}

/* =========================================================
   输入
   ========================================================= */
function toLocal(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * W,
    y: (e.clientY - r.top) / r.height * H
  };
}
function inCircle(x, y, c) {
  const dx = x - c.x, dy = y - c.y;
  return dx * dx + dy * dy <= c.r * c.r;
}

canvas.addEventListener('pointerdown', function (e) {
  if (state.mode !== 'playing') return;
  const pt = toLocal(e);
  if (inCircle(pt.x, pt.y, BTN.pause)) { togglePause(); return; }
  if (inCircle(pt.x, pt.y, BTN.mute)) { toggleMute(); return; }
  if (inCircle(pt.x, pt.y, BTN.bomb)) { useBomb(); return; }
  pointer.active = true;
  pointer.id = e.pointerId;
  pointer.x = pt.x;
  pointer.y = pt.y;
  pointer.ox = player.x - pt.x;
  pointer.oy = player.y - pt.y;
  if (canvas.setPointerCapture) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', function (e) {
  if (!pointer.active || e.pointerId !== pointer.id) return;
  const pt = toLocal(e);
  pointer.x = pt.x;
  pointer.y = pt.y;
  e.preventDefault();
}, { passive: false });

function endPointer(e) {
  if (e && pointer.id !== null && e.pointerId !== pointer.id) return;
  pointer.active = false;
  pointer.id = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', endPointer);
window.addEventListener('blur', function () { pointer.active = false; keys.clear(); });

window.addEventListener('keydown', function (e) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') {
    e.preventDefault();
  }
  keys.add(k.length === 1 ? k.toLowerCase() : k);

  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state.mode === 'playing' || state.mode === 'paused') togglePause();
  }
  if (k === 'm' || k === 'M') toggleMute();
  if (k === 'b' || k === 'B') useBomb();
  if ((k === 'Enter' || k === ' ') && (state.mode === 'menu' || state.mode === 'over')) {
    e.preventDefault();
    if (state.mode === 'over') startGame(state.stage); else startGame(1);
  }
});
window.addEventListener('keyup', function (e) {
  keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key);
});

overlay.addEventListener('input', function (e) {
  const el = e.target.closest('[data-action="volume"]');
  if (!el) return;
  const v = Number(el.value) / 100;
  setVolume(v);
  el.style.setProperty('--p', el.value + '%');
  const label = el.parentElement.querySelector('span');
  if (label) label.textContent = el.value + '%';
  if (!muted && SAVE.sfx) SFX.ui();
});

overlay.addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.getAttribute('data-action');
  if (a === 'play') startGame(1);
  else if (a === 'stages') { selPage = -1; SFX.ui(); showScreen(stagesHTML()); }
  else if (a === 'page') {
    const pageCount = Math.ceil(TOTAL_STAGES / PAGE_SIZE);
    selPage = clamp(selPage + Number(el.getAttribute('data-dir')), 0, pageCount - 1);
    SFX.ui(); showScreen(stagesHTML());
  }
  else if (a === 'stage') { SFX.ui(); startGame(parseInt(el.getAttribute('data-stage'), 10) || 1); }
  else if (a === 'unlock') {
    const n = parseInt(el.getAttribute('data-stage'), 10) || 1;
    if (!canPayUnlock(n)) { SFX.deny(); toast(t('toast_unlock_front')); return; }
    if (SAVE.coins < UNLOCK_COST) { SFX.deny(); toast(t('toast_poor_ad', { n: UNLOCK_COST - SAVE.coins, ad: AD_REWARD })); return; }
    SAVE.coins -= UNLOCK_COST;
    if (SAVE.unlocked.indexOf(n) < 0) SAVE.unlocked.push(n);
    persist(); SFX.buy(); toast(t('toast_unlocked', { n: String(n).padStart(3, '0') }));
    showScreen(stagesHTML());
  }
  else if (a === 'endless') { SFX.ui(); startGame(TOTAL_STAGES + 1); }
  else if (a === 'shop') { SFX.ui(); showScreen(shopHTML()); }
  else if (a === 'ad') startAd();
  else if (a === 'ad-start') beginAd();
  else if (a === 'save') {
    persist(true);
    SFX.ui();
    toast(storageOK ? t('toast_save_ok', { time: saveClock() }) : t('toast_save_fail'));
    showScreen(settingsHTML());
  }
  else if (a === 'export-save') exportSave();
  else if (a === 'import-save') {
    const inp = document.getElementById('saveFile');
    if (inp) { inp.value = ''; inp.click(); }
  }
  else if (a === 'diff') { SFX.ui(); showScreen(diffHTML()); }
  else if (a === 'settings') { SFX.ui(); showScreen(settingsHTML()); }
  else if (a === 'feedback') { SFX.ui(); showScreen(feedbackHTML()); }
  else if (a === 'copy-mail') copyFeedbackMail();
  else if (a === 'toggle') {
    const key = el.getAttribute('data-key');
    const next = !SAVE[key];
    if (key === 'muted') setMuted(next); else setOption(key, next);
    SFX.ui(); showScreen(settingsHTML());
  }
  else if (a === 'home') { SFX.ui(); clearTimeout(overTimer); showMenu(); }
  else if (a === 'buy') buySkin(el.getAttribute('data-skin'));
  else if (a === 'equip') equipSkin(el.getAttribute('data-skin'));
  else if (a === 'setdiff') setDiff(el.getAttribute('data-diff'));
  else if (a === 'lang') {
    const lc = el.getAttribute('data-lang');
    const ln = LANGS.find(function (x) { return x.code === lc; });
    if (ln) { SAVE.lang = lc; persist(); SFX.ui(); toast(t('toast_lang', { name: ln.label })); showScreen(settingsHTML()); }
  }
  else if (a === 'reset') {
    SFX.deny();
    if (confirm(t('reset_confirm'))) {
      saveBlocked = true;
      try {
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(SAVE_BAK_KEY);
      } catch (err) {}
      lastJson = '';
      location.reload();
    }
  }
  else if (a === 'resume') togglePause();
  else if (a === 'revive') revive();
  else if (a === 'retry') startGame(state.stage || 1);
  else if (a === 'next') startGame((state.stage || 1) + 1);
});

overlay.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'saveFile') importSaveFromFile(e.target.files && e.target.files[0]);
});

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    persist();
    if (state.mode === 'playing') togglePause();
  }
});
window.addEventListener('pagehide', function () { persist(); });
window.addEventListener('beforeunload', function () { persist(); });

window.addEventListener('resize', fit);

/* =========================================================
   启动
   ========================================================= */
loadSave();
bullets = []; ebullets = []; enemies = []; particles = [];
powerups = []; coins = []; spawnList = []; boss = null;
fit();
initStars();
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
